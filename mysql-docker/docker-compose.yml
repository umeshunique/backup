version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-backup-server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Apple#123
      MYSQL_USER: admin
      MYSQL_PASSWORD: Apple#123
      MYSQL_DATABASE: backup_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-pApple#123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
