<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>

  <!-- Database cylinder layers representing "Data" -->
  <ellipse cx="50" cy="35" rx="25" ry="8" fill="#ffffff" opacity="0.9"/>
  <rect x="25" y="35" width="50" height="12" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="50" cy="47" rx="25" ry="8" fill="#ffffff" opacity="0.9"/>

  <!-- U shape representing "U" in UData -->
  <path d="M 30 55 L 30 70 Q 30 78 38 78 L 62 78 Q 70 78 70 70 L 70 55"
        stroke="#ffffff"
        stroke-width="6"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Accent dot -->
  <circle cx="50" cy="80" r="3" fill="#fbbf24"/>
</svg>
